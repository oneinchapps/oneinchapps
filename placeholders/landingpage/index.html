<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>oneinchapps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="oneinchapps — App-Company. Neue Produkte in Arbeit.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <style>
    :root {
      --ink: #353534;
      --red: #b51f1f;
      --bg: #ffffff;
      --muted: #7a7a79;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: min(480px, 90vw);
    }
    .logo {
      width: min(320px, 70vw);
      height: auto;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .accent {
      width: 40px;
      height: 3px;
      background: var(--red);
      border: 0;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.png" alt="oneinchapps" width="960" height="249">
    <hr class="accent">
    <p>Neue Produkte in Arbeit. Coming soon.</p>
  </main>
</body>
</html>
