services:
  traefik:
    volumes:
      - ./traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./certs:/etc/traefik/certs:ro
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"

  landingpage:
    labels:
      traefik.http.routers.landingpage.entrypoints: "websecure"
      traefik.http.routers.landingpage.tls: "true"
      traefik.http.routers.landingpage-www.rule: "Host(`www.${DOMAIN}`)"
      traefik.http.routers.landingpage-www.entrypoints: "websecure"
      traefik.http.routers.landingpage-www.tls: "true"
      traefik.http.routers.landingpage-www.middlewares: "www-redirect"
      traefik.http.middlewares.www-redirect.redirectregex.regex: "^https?://www\\.(.+)"
      traefik.http.middlewares.www-redirect.redirectregex.replacement: "https://$${1}"
      traefik.http.middlewares.www-redirect.redirectregex.permanent: "true"

  headbase:
    labels:
      traefik.http.routers.headbase.entrypoints: "websecure"
      traefik.http.routers.headbase.tls: "true"
